; LVGL 9 demo - 立创·黄山派 (SF32LB52-ULP) + CO5300 AMOLED 屏幕板
;
; pio run            build
; pio run -t upload  download over UART
; pio device monitor serial console (115200, see monitor_speed)

[env:sf32lb52-lchspi-ulp]
platform = git+https://github.com/hysonglet/platformio-sifi.git
board = sf32lb52-lchspi-ulp
framework = sifli-sdk

; forwarded into the SDK's scons build (appended to CCFLAGS)
; build_flags = -DMY_MACRO=1

; use a local SDK checkout instead of the one bundled with the platform
; custom_sifli_sdk_dir = /path/to/SiFli-SDK

; the SDK default console baud is 1000000; proj.conf sets
; CONFIG_RT_SERIAL_DEFAULT_BAUDRATE=115200, so the monitor must follow it
monitor_speed = 115200
