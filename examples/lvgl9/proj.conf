CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_RT_SERIAL_DEFAULT_BAUDRATE=115200

# === LVGL v9 (LittlevGL2RTT adapter) ===
CONFIG_RT_USING_MEMHEAP=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LVGL_V9=y
# This board's CO5300 panel doesn't output TE reliably -> disable VSYNC sync
# to avoid draw_core timeout (LCDC waits forever for TE that never comes).
CONFIG_LCD_CO5300_VSYNC_ENABLE=n
CONFIG_LV_DEF_REFR_PERIOD=16
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_PRINTF=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_RT_MAIN_THREAD_STACK_SIZE=4096
# disable external resource manager (avoids needing generated lang_pack.h)
# CONFIG_LV_USING_EXT_RESOURCE_MANAGER is not set
